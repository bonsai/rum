[package]
name = "rum"
version = "0.1.0"
edition = "2021"
description = "Vim-style TUI reader/editor for chira-ura markdown notes"

[[bin]]
name = "rum"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
dirs = "5.0"
